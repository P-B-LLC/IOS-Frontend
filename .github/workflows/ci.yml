name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release gate runs exactly these checks rather than a
  # second copy of them that can drift away from the ones that matter.
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The deployment target is iOS 26.5, so this needs an Xcode 26 SDK.
      #
      # This used to be `xcode-select -s /Applications/Xcode_26.app`, pinned
      # so a runner image bump could not silently change the compiler. The
      # pin did the opposite: the image stopped shipping that exact path, the
      # step failed, every later step was skipped, and the run reported a red
      # build having compiled nothing at all. Thirty consecutive runs did
      # that before anybody read the step names rather than the verdict.
      #
      # So take the newest Xcode the image actually has, print what was
      # there, and fail on the version rather than on a path -- a message
      # naming what it found is repairable, "invalid developer directory" is
      # a guessing game.
      - name: Select Xcode
        run: |
          echo "Xcodes on this image:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  none"
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$newest" ]; then
            echo "No Xcode on this runner image."
            exit 1
          fi
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 26 ]; then
            echo "This project targets iOS 26.5 and needs Xcode 26 or newer."
            echo "The newest on this image is Xcode ${major:-unknown}."
            echo "Change runs-on to an image that ships one."
            exit 1
          fi

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      # A simulator build needs no signing, and asking for it on a runner
      # with no certificates fails for a reason that has nothing to do with
      # the code.
      - name: Build
        run: |
          xcodebuild \
            -project "IOS Frontend/IOS Frontend.xcodeproj" \
            -scheme "IOS Frontend" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # A release build reads its server from REPBASE_API_URL in the bundle
      # and refuses to run without an https one. That plumbing was broken and
      # nothing noticed, because nothing here had ever built Release: the key
      # was set as INFOPLIST_KEY_REPBASE_API_URL, which only works for keys
      # Xcode knows about, so it never reached the built plist and every
      # release build died on launch. This builds Release and reads the key
      # back out, which is the only way to see that it survived the build.
      - name: A release build carries the name and server it was given
        run: |
          xcodebuild \
            -project "IOS Frontend/IOS Frontend.xcodeproj" \
            -scheme "IOS Frontend" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            REPBASE_API_URL="https://ci.invalid/" \
            build
          plist=".build/DerivedDataRelease/Build/Products/Release-iphonesimulator/Rytivo.app/Info.plist"
          got=$(/usr/libexec/PlistBuddy -c "Print :REPBASE_API_URL" "$plist" 2>/dev/null || true)
          if [ "$got" != "https://ci.invalid/" ]; then
            echo "REPBASE_API_URL did not reach the built app: got '${got:-<missing>}'."
            echo "A release build would crash on launch. It must be a key in"
            echo "IOS Frontend/Info.plist spelled \$(REPBASE_API_URL), not an"
            echo "INFOPLIST_KEY_ build setting."
            exit 1
          fi

          # The same question about a different key. CFBundleName is what
          # Settings, storage listings and App Store Connect fall back to,
          # and it is generated from PRODUCT_NAME unless Info.plist wins the
          # merge -- which is precisely what this asserts, because "does the
          # generator or the file win" is not worth anyone re-deriving.
          name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$plist" 2>/dev/null || true)
          if [ "$name" != "Rytivo" ]; then
            echo "CFBundleName is '${name:-<missing>}', not Rytivo."
            echo "It is set in IOS Frontend/Info.plist. If the value generated"
            echo "from PRODUCT_NAME is winning that merge, set PRODUCT_NAME"
            echo "instead and update the .app paths in this file."
            exit 1
          fi

      # API/GeneratedSources is committed, and the client is generated from
      # API/openapi.yaml. A contract updated without regenerating leaves the
      # app talking to a server it no longer matches -- which is how a saved
      # meal came back as a number the client had been told was a string.
      - name: Generated client matches the contract
        run: |
          bash Scripts/generate-api-client.sh
          if ! git diff --quiet -- API/GeneratedSources; then
            echo "API/GeneratedSources is stale. Regenerate and commit:"
            echo "  bash Scripts/generate-api-client.sh"
            git diff --stat -- API/GeneratedSources
            exit 1
          fi

      # Models carrying a client-side UUID must be given one when decoded,
      # not handed a fresh one. A refetch otherwise renames every row in a
      # collection, and whatever was holding an id loses what it pointed at.
      # That shipped as "Meal Not Found" over a meal that was still there,
      # and as flicker everywhere else it happened.
      - name: Decoded models have stable ids
        run: python3 Scripts/check-stable-ids.py

      - name: Account safety regression tests
        run: bash Scripts/test-account-safety.sh
