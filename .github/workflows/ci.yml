name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release gate runs exactly these checks rather than a
  # second copy of them that can drift away from the ones that matter.
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The deployment target is iOS 26.5, so the default Xcode on the runner
      # image is not always new enough. Pinned rather than left to drift,
      # because a runner image bump silently changing the compiler is the
      # kind of failure that looks like the code broke.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      # A simulator build needs no signing, and asking for it on a runner
      # with no certificates fails for a reason that has nothing to do with
      # the code.
      - name: Build
        run: |
          xcodebuild \
            -project "IOS Frontend/IOS Frontend.xcodeproj" \
            -scheme "IOS Frontend" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # A release build reads its server from REPBASE_API_URL in the bundle
      # and refuses to run without an https one. That plumbing was broken and
      # nothing noticed, because nothing here had ever built Release: the key
      # was set as INFOPLIST_KEY_REPBASE_API_URL, which only works for keys
      # Xcode knows about, so it never reached the built plist and every
      # release build died on launch. This builds Release and reads the key
      # back out, which is the only way to see that it survived the build.
      - name: A release build carries the server it was given
        run: |
          xcodebuild \
            -project "IOS Frontend/IOS Frontend.xcodeproj" \
            -scheme "IOS Frontend" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            REPBASE_API_URL="https://ci.invalid/" \
            build
          plist=".build/DerivedDataRelease/Build/Products/Release-iphonesimulator/IOS Frontend.app/Info.plist"
          got=$(/usr/libexec/PlistBuddy -c "Print :REPBASE_API_URL" "$plist" 2>/dev/null || true)
          if [ "$got" != "https://ci.invalid/" ]; then
            echo "REPBASE_API_URL did not reach the built app: got '${got:-<missing>}'."
            echo "A release build would crash on launch. It must be a key in"
            echo "IOS Frontend/Info.plist spelled \$(REPBASE_API_URL), not an"
            echo "INFOPLIST_KEY_ build setting."
            exit 1
          fi

      # API/GeneratedSources is committed, and the client is generated from
      # API/openapi.yaml. A contract updated without regenerating leaves the
      # app talking to a server it no longer matches -- which is how a saved
      # meal came back as a number the client had been told was a string.
      - name: Generated client matches the contract
        run: |
          bash Scripts/generate-api-client.sh
          if ! git diff --quiet -- API/GeneratedSources; then
            echo "API/GeneratedSources is stale. Regenerate and commit:"
            echo "  bash Scripts/generate-api-client.sh"
            git diff --stat -- API/GeneratedSources
            exit 1
          fi

      # Models carrying a client-side UUID must be given one when decoded,
      # not handed a fresh one. A refetch otherwise renames every row in a
      # collection, and whatever was holding an id loses what it pointed at.
      # That shipped as "Meal Not Found" over a meal that was still there,
      # and as flicker everywhere else it happened.
      - name: Decoded models have stable ids
        run: python3 Scripts/check-stable-ids.py

      - name: Account safety regression tests
        run: bash Scripts/test-account-safety.sh
