name: Release gate

# The live main ruleset requires PRs and a passing CI build, not peer approval.
# Re-run that same suite for release tags or an explicitly dispatched candidate.
# This workflow reports a verdict; it cannot prevent a manual Xcode upload.
# Release operators must verify the exact candidate before shipping it.
on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed against any branch before the tag is cut.
  workflow_dispatch:

# Read-only. Nothing here pushes, comments or publishes, so the job token
# gets no more than a checkout needs, whatever the repository default is.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  verdict:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Say plainly whether this version may ship
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "### Do not ship ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The build and test checks did not pass, so this tag is not releasable." >> "$GITHUB_STEP_SUMMARY"
            echo "Open the 'checks' job above for the failure." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ${GITHUB_REF_NAME} passed the release checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The app target builds, the generated client matches the contract," >> "$GITHUB_STEP_SUMMARY"
          echo "decoded models keep their ids, and the account safety tests pass." >> "$GITHUB_STEP_SUMMARY"
